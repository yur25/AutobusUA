services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: autobusua
            POSTGRES_USER: autobusua
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - "${POSTGRES_PORT:-55432}:5432"
        volumes:
            - autobusua-postgres-data:/var/lib/postgresql/data
            - ./database/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U autobusua -d autobusua"]
            interval: 3s
            timeout: 3s
            retries: 20

volumes:
    autobusua-postgres-data:
